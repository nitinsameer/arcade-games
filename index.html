<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Style Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Space+Grotesk:wght@500;700&family=Orbitron:wght@700;900&family=Press+Start+2P&family=VT323&family=Patrick+Hand&family=Caveat:wght@700&family=Share+Tech+Mono&family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root,[data-theme]{--bg:#ece8fb;--bgc:#ece8fb;--card:#f7f4ff;--ink:#2d2650;--mute:#7a72a8;--accent:#7c5cf0;--accentg:linear-gradient(135deg,#8b6cf6,#6a4fe0);--onacc:#fff;--green:#5cc46b;--greeng:linear-gradient(135deg,#6fd37e,#4cb85c);
--r:26px;--rs:20px;--bd:0;--bdt:0;--blur:none;--well:#ece8fb;--barfill:#ffd66b;
--sh:9px 9px 20px rgba(124,100,200,.26),-7px -7px 16px rgba(255,255,255,.95),inset -4px -4px 9px rgba(110,90,190,.13),inset 4px 4px 9px rgba(255,255,255,.8);
--shs:5px 5px 11px rgba(124,100,200,.26),-3px -3px 8px rgba(255,255,255,.95),inset -3px -3px 7px rgba(110,90,190,.13),inset 3px 3px 7px rgba(255,255,255,.8);
--sin:inset 3px 3px 7px rgba(110,90,190,.16),inset -3px -3px 7px rgba(255,255,255,.85);
--sht:7px 7px 15px rgba(124,100,200,.26),-5px -5px 11px rgba(255,255,255,.95),inset -5px -5px 10px rgba(0,0,0,.1),inset 5px 5px 10px rgba(255,255,255,.55);
--shbtn:7px 7px 15px rgba(124,100,200,.26),-5px -5px 11px rgba(255,255,255,.95),inset -5px -5px 10px rgba(0,0,0,.22),inset 5px 5px 10px rgba(255,255,255,.3);
--tilebg:var(--t);--tilec:#2d2650;--curbg:linear-gradient(135deg,#d9ccff,#c4b2ff);--curc:#2d2650;--okbg:#c9f2d3;--okc:#173d20;--badbg:#ffd0d0;--badc:#5a1a1a;--lvlbg:#ffd9b0;--lvlc:#7a3d00;
--navbg:var(--bgc);--navsh:0 -8px 20px rgba(124,100,200,.26);--font:'Nunito',system-ui,sans-serif;--fonth:'Nunito',system-ui,sans-serif;--tsh:none}
</style>
</head>

<div id="app"></div>

</body>
