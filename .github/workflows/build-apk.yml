name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Google TEST AdMob app id. Replace with your real AdMob App ID before publishing.
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure AdMob (manifest app id + min SDK)
        run: |
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/></application>#" android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
          grep -n "minSdkVersion" android/variables.gradle

      - name: Sync web files and plugins into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: style-lab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
